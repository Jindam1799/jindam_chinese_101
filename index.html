<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7ef">
<meta name="author" content="진담중국어 (Jindam Chinese)">
<!-- © 2026 진담중국어 (Jindam Chinese). All rights reserved. -->
<title>진담 100문장 툭!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f7ef; --ink:#263f36; --muted:#778077; --green:#315e48; --green2:#254b39; --light:#edf2e8; --line:#e3e7dc;
  --leaf:#aac875; --leafd:#5d8a4a; --orange:#db794c; --red:#b94b3d; --sun:#f6e3a8; --cream:#faf8f1; --soft:#dce7d3;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.zh{font-family:var(--zh)}
#app{height:100vh;height:100dvh;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));overflow:hidden}
.fill{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.scroll{overflow:auto;min-height:0}
.none{flex:none}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .tiny{font-size:11px;color:var(--muted)}

/* ── 상단바 ── */
.top{display:flex;align-items:center;gap:10px;flex:none;min-height:44px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.top .round+.round{margin-left:-2px}
.brand-icon{width:38px;height:38px;flex:none}
.brand-icon svg{width:100%;height:100%;display:block}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.5px;line-height:1.2}
.brand strong{display:block;font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.25;white-space:nowrap}
.brand strong em{font-style:normal;color:#5d8a4a}
.top h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.25;flex:1;min-width:0}
.top h2 small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;padding:0;color:var(--green)}
.round svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:30px;padding:4px 10px;background:var(--soft);color:var(--green);white-space:nowrap}
.pill.white{background:#fffffff0;box-shadow:0 2px 8px #263f3614}
.pill.orange{background:#fbe6db;color:#a8532c}
.pill.gold{background:var(--sun);color:#8a5a12}

/* ── 버튼 ── */
.btn{border:0;border-radius:13px;min-height:50px;padding:10px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.25;text-align:center;transition:.15s}
.btn small{display:block;font-size:11px;font-weight:500;opacity:.85}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green2)}
.btn.secondary{background:var(--light);color:var(--green)}
.btn.line{background:#fff;color:var(--green);border:1.5px solid var(--line)}
.btn.orange{background:var(--orange);color:#fff}
.btn.warn{background:var(--red);color:#fff}
.btn:active{transform:translateY(1px)}
.btns{display:flex;gap:8px;flex:none}
.btns>.btn{flex:1}
.btn .k{font-size:10px;opacity:.55;border:1px solid currentColor;border-radius:4px;padding:0 4px;font-weight:500}
.cta{display:flex;gap:8px;flex:none}
.cta .go{flex:1;justify-content:space-between;text-align:left;min-height:62px;border-radius:16px;padding:10px 18px}
.cta .go b{font-size:16px;display:block}
.cta .go .arrow{font-size:22px;font-weight:400}
.cta .side{width:72px;flex:none;flex-direction:column;gap:2px;font-size:11px;border-radius:16px;min-height:62px;padding:6px}
.cta .side svg{width:22px;height:22px}

/* ── 홈: 숲 장면 ── */
.scene{position:relative;flex:none;aspect-ratio:1/1;width:min(100%,calc(100dvh - 268px));margin:0 auto;container-type:size;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#e9efe0 center/cover no-repeat}
.scene .tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;max-width:65%}
.scene .tr{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.scene .stage{position:absolute;left:0;right:0;bottom:62px;top:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.scene .bubble{position:relative;background:#fff;border-radius:16px;padding:9px 13px;font-size:13px;line-height:1.5;max-width:min(300px,86%);box-shadow:0 6px 18px #263f361f;margin-bottom:10px;text-align:center}
.scene .bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.scene .bubble b{color:var(--green)}
.scene .meter{position:absolute;left:10px;right:10px;bottom:10px;background:#ffffffe8;border-radius:16px;padding:8px 12px;backdrop-filter:blur(4px)}
.meter .nums{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.meter .nums b{color:var(--ink);font-size:13px}
.bar2{position:relative;height:9px;border-radius:9px;background:#e6eadd;overflow:hidden}
.bar2 u{position:absolute;left:0;top:0;bottom:0;background:#b7cfa3;border-radius:9px}
.bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:9px}
.bar2 s{position:absolute;top:0;bottom:0;width:2px;background:#ffffffcc}
.tuk{display:block;cursor:pointer;background:none;border:0;padding:0}
.tuk svg{display:block;width:100%;height:100%}
.tuk.big{width:118px;height:118px}
.tuk.breathe svg{animation:breathe 3.5s ease-in-out infinite;transform-origin:50% 90%}
@keyframes breathe{50%{transform:translateY(-4px) rotate(1.5deg)}}
.tuk.hop svg{animation:hop .55s ease-out 1}
@keyframes hop{40%{transform:translateY(-14px) scale(1.04)}}
.tuk.shake svg{animation:nod .5s ease 1}
@keyframes nod{30%{transform:rotate(-6deg)}70%{transform:rotate(5deg)}}

/* ── 홈: 메뉴 타일 ── */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.tile{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-height:78px;justify-content:center}
.tile:hover{border-color:var(--green)}
.tile .ic{width:34px;height:34px;border-radius:11px;background:var(--light);color:var(--green);display:grid;place-items:center}
.tile .ic svg{width:20px;height:20px}
.tile b{font-size:12.5px;letter-spacing:-.3px;line-height:1.2}
.tile small{font-size:10px;color:var(--muted);line-height:1.2}
.tile .badge{position:absolute;top:6px;right:7px;min-width:19px;height:19px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.tile.t-order .ic{background:#fbf0d6;color:#a5701b}
.tile.t-review .ic{background:#fbe6db;color:#b55d34}
.tile.t-mine .ic{background:#e7eef6;color:#3f6788}
.tile.t-report .ic{background:#efe9f6;color:#6d5596}
.tile.t-ba .ic{background:#f6e8ee;color:#a04f6c}

/* ── 시트(모달) ── */
.modal{position:fixed;inset:0;z-index:40;background:#1e362d66;backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:540px;max-height:90dvh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px #243e3633;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:26px;max-width:460px}}
.sheet h3{margin:0;font-size:19px;letter-spacing:-.5px}
.sheet .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tabs{display:flex;background:var(--light);border-radius:13px;padding:4px;gap:4px;flex:none}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--green);box-shadow:0 2px 6px #263f3614}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.lrow:hover{border-color:var(--green)}
.lrow .num{width:36px;height:36px;border-radius:11px;background:var(--light);color:var(--green);font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.lrow.cp .num{background:var(--sun);color:#8a5a12}
.lrow.next{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.lrow b{display:block;font-size:14.5px;letter-spacing:-.3px}
.lrow small{display:block;font-size:11px;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:50%;background:#e1e6d9}
.lv0{background:#e1e6d9!important}.lv1{background:#c9d6bb!important}.lv2{background:#8fb07a!important}.lv3{background:#4f8a62!important}.lv4{background:#e0a33a!important}
.slist{list-style:none;margin:6px 0 12px;padding:0}
.slist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.slist li:last-child{border-bottom:0}
.slist .zh{font-weight:700;font-size:15px}
.slist small{display:block;font-size:11.5px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* ── 학습 화면 ── */
.prog{height:6px;border-radius:6px;background:#e6eadd;overflow:hidden;flex:none;display:flex;gap:2px}
.prog i{flex:1;background:#e6eadd}
.prog i.ok{background:var(--green)} .prog i.no{background:#e4a98b} .prog i.cur{background:var(--leaf)}
.coach{display:flex;align-items:center;gap:8px;flex:none}
.coach .tuk{width:52px;height:52px;flex:none}
.coach .say{position:relative;flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.45;min-height:42px}
.coach .say::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:var(--line);border-left:0}
.coach .say::after{content:"";position:absolute;left:-5px;top:50%;margin-top:-5px;border:5px solid transparent;border-right-color:#fff;border-left:0}
.coach .say b{color:var(--green)}
.card{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;box-shadow:0 6px 24px #263f360a}
.card .meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:10px;flex:none}
.card .lbl{font-size:12px;color:var(--muted);margin-bottom:3px}
.card .prompt{font-size:21px;font-weight:800;letter-spacing:-.6px;line-height:1.4;word-break:keep-all}
.card .qzh{font-family:var(--zh);font-size:25px;font-weight:700;line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .cue{margin-top:6px;font-size:13px;color:var(--muted)}
.card .center{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.hint{margin-top:12px;background:var(--cream);border-radius:14px;padding:10px 12px;font-size:12px;color:#83776b}
.hint .f{font-family:var(--zh);font-size:18px;font-weight:700;color:var(--green);margin:1px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips span{font-family:var(--zh);font-weight:700;font-size:15px;background:var(--sun);color:#6b4a10;border-radius:8px;padding:2px 10px}
.ans{margin-top:12px;padding-top:12px;border-top:1px dashed #d8dccf}
.ans .zhs{font-family:var(--zh);font-size:26px;font-weight:700;line-height:1.45;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ans .py{font-size:14.5px;color:#4c7a62;margin-top:2px}
.ans .ko{font-size:13.5px;color:var(--muted);margin-top:3px}
.ans .fr{font-size:12px;color:var(--muted);margin-top:8px}
.ans .fr b{font-family:var(--zh);font-size:15px;color:var(--green)}
mark{background:linear-gradient(transparent 60%,#f6dd94 60%);color:inherit;padding:0 1px}
.rt{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:#8a5a12;background:var(--sun);border-radius:20px;padding:3px 10px}
.spk{width:38px;height:38px;border-radius:50%;border:0;background:var(--light);color:var(--green);display:inline-grid;place-items:center;padding:0;flex:none}
.spk svg{width:20px;height:20px}
.keys{font-size:11px;color:var(--muted);text-align:center;flex:none;margin-top:-4px}

/* 덩어리 맞추기 */
.rail{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:62px;margin-top:14px;padding:10px;background:var(--cream);border-radius:16px;border:1.5px dashed #d9d2bd}
.slot{width:52px;height:44px;border-radius:11px;border:1.5px dashed #cfc6ad;background:#fff8}
.endp{font-family:var(--zh);font-size:21px;font-weight:700;color:var(--muted)}
.oc{position:relative;font-family:var(--zh);font-weight:700;font-size:20px;line-height:1.2;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 3px 0 #dfe4d6;min-height:46px}
.oc:active{transform:translateY(2px);box-shadow:0 1px 0 #dfe4d6}
.oc.placed{background:#fff;border-color:#c8d4bb}
.oc.good{background:#e3eedb;border-color:var(--leafd);color:var(--green);box-shadow:none}
.oc.bad{background:#fbe2d7;border-color:var(--orange);color:#9b4522;box-shadow:none}
.oc.used{visibility:hidden}
.oc:disabled{opacity:1}
.oc .n{position:absolute;top:-8px;left:-6px;font-family:var(--sans);font-size:10px;font-weight:700;background:var(--green);color:#fff;border-radius:6px;padding:0 5px;line-height:1.6}
.tray{display:flex;flex-wrap:wrap;gap:12px 9px;justify-content:center;margin-top:18px;padding-top:4px}
.shakex{animation:shk .3s ease 2}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ── 결과 ── */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;flex:none}
.done .tuk{width:96px;height:96px}
.done h3{margin:2px 0 0;font-size:21px;letter-spacing:-.6px}
.done p{margin:0;font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px;flex:none}
.stats>div{flex:1;background:var(--light);border-radius:14px;padding:10px 4px;text-align:center}
.stats strong{display:block;font-size:21px;line-height:1.2}
.stats span{font-size:10.5px;color:var(--muted)}
.box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.box h4{margin:0 0 4px;font-size:14px}

/* ── 내 문장 ── */
.picker{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left;flex:none}
.picker .zh{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker small{color:var(--green);font-weight:700;font-size:12px;flex:none}
textarea,input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:13px;background:#fff;padding:10px 12px;font-size:17px;font-family:var(--zh),var(--sans);color:var(--ink);outline:none;resize:none}
textarea:focus,input:focus{border-color:var(--green)}
.cnt3{display:flex;gap:6px}
.cnt3 button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;min-height:40px;font-weight:700;font-size:13px;color:var(--muted)}
.cnt3 button.on{background:var(--green);border-color:var(--green);color:#fff}
.lab{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px}

/* ── 리포트 ── */
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.block h5{margin:0 0 5px;font-size:11.5px;color:var(--muted);font-weight:700}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.g5 button{aspect-ratio:1;border-radius:7px;border:0;padding:0;min-width:0}
.g5 button.cpc{box-shadow:inset 0 0 0 2px #e0a33a}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:0}
.lvbars .r{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.lvbars .r>span:first-child{width:62px;font-weight:700}
.lvbars .r .b{flex:1;height:8px;border-radius:8px;background:#e6eadd;overflow:hidden}
.lvbars .r .b i{display:block;height:100%;border-radius:8px}
.lvbars .r>span:last-child{width:28px;text-align:right;font-weight:700}
.cmp{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px 8px;font-size:13px;align-items:center}
.cmp .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.cmp .v{font-size:18px;font-weight:800;text-align:center;background:var(--light);border-radius:10px;padding:4px 0}
.cmp .v.a{background:#e3eedb;color:var(--green)}

/* ── 실력 확인 ── */
.clock{font-size:64px;font-weight:800;letter-spacing:-2px;text-align:center;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.cues{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cues span{background:var(--light);color:var(--green);border-radius:20px;padding:4px 11px;font-size:12.5px;font-weight:700}
.form label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 4px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{border-color:var(--green);color:var(--green);background:var(--light)}

#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:30px;font-size:13.5px;font-weight:700;padding:10px 18px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px #0003}
#toast.on{opacity:1}
.fx{position:fixed;pointer-events:none;z-index:50;font-size:18px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.hr{height:1px;background:var(--line);margin:12px 0}

@media (max-height:640px){
  .tile{min-height:64px;padding:7px 4px}
  .tile small{display:none}
  .cta .go{min-height:54px}.cta .side{min-height:54px}
  .tuk.big{width:92px;height:92px}
  .scene .bubble{font-size:12px;padding:7px 11px}
  .coach .tuk{width:42px;height:42px}
  .card{padding:12px 14px}
  .card .prompt{font-size:19px}
  .ans .zhs{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.desk-intro{display:none}

/* 병음을 글자(음절) 단위로 나눠 덩어리 카드 위에 붙여요 */
const PY_BASE = { 'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v' };
const PY_INI = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w',''];
const PY_FIN = ['iang','iong','uang','ueng','ang','eng','ing','ong','ian','iao','uai','uan','van','ai','ei','ao','ou','an','en','in','un','vn','ia','ie','iu','ua','uo','ui','ve','ue','er','a','o','e','i','u','v'];
const PY_ZERO = new Set(['a','o','e','ai','ei','ao','ou','an','en','ang','eng','er']);
function pySplitWord(w) {
  const base = [...w].map(ch => PY_BASE[ch] || ch.toLowerCase()).join('');
  const memo = {};
  function go(i) {
    if (i === base.length) return [];
    if (i in memo) return memo[i];
    for (const ini of PY_INI) {
      if (!base.startsWith(ini, i)) continue;
      for (const fin of PY_FIN) {
        if (!ini && !PY_ZERO.has(fin)) continue;
        if (!base.startsWith(fin, i + ini.length)) continue;
        let j = i + ini.length + fin.length;
        for (const r of (base[j] === 'r' && fin !== 'er' ? [1, 0] : [0])) {
          const rest = go(j + r);
          if (rest) return (memo[i] = [[i, j + r]].concat(rest));
        }
      }
    }
    return (memo[i] = null);
  }
  const cuts = go(0);
  return cuts ? cuts.map(([a, b]) => [...w].slice(a, b).join('')) : [w];
}
// 문장 전체: 글자마다 [음절, 단어번호]
function pyChars(zh, py) {
  // 문장 첫 글자 대문자(Wǒ 등)는 정답 힌트가 되므로 소문자로 (문장 중간의 고유명사 대문자는 그대로)
  py = py.replace(/(^|[.?!。？！]\s*)(\S)/g, (m, a, b) => a + b.toLowerCase());
  const words = py.replace(/[，。？！,.?!"“”]/g, ' ').split(/\s+/).filter(Boolean);
  const syl = []; words.forEach((w, wi) => w.split("'").forEach((part, pi) => pySplitWord(part).forEach((s, si) => syl.push([(pi && !si ? "'" : '') + s, wi]))));
  const out = []; let k = 0;
  [...zh].forEach((ch, i) => {
    if (/[，。？！、]/.test(ch)) { out.push(null); return; }
    if (ch === '儿' && k > 0 && /r$/.test(syl[k - 1][0]) && i > 0 && zh[i - 1] !== '儿') { out.push(['', syl[k - 1][1]]); return; }
    out.push(syl[k] || ['?', -1]); k++;
  });
  out.ok = k === syl.length;

  ALL.forEach(s => { const c = C(s.id), lv = c ? c.lv : 0; by[lv]++; if (lv > 0) seen++; if (lv >= 3) solid++; });
  return { seen, solid, by, due: dueList().length };
}
function nextLesson() {
  for (let n = Math.max(1, S.last || 1); n <= 20; n++) if (LES(n).s.some((_, i) => !(C((n - 1) * 5 + i + 1) || {}).lv)) return n;
  for (let n = 1; n <= 20; n++) if (LES(n).s.some((_, i) => !(C((n - 1) * 5 + i + 1) || {}).lv)) return n;
  return 20;
}

function startSession(kind, items, title, extra) {
  SES = Object.assign({ kind, title, q: items, i: 0, res: [], hint: 0, revealed: false, t0: 0, rt: 0, streak: 0, best: 0, cue: false }, extra || {});
  go('drill');
}
function startLesson(n) {
  S.last = Math.max(S.last || 0, n); save();
  const ss = LES(n).s.map((_, i) => BYID[(n - 1) * 5 + i + 1]);
  const items = ss.map(s => ({ id: s.id, mode: 'order', pm: 'ko', build: true, stage: 1 })).concat(ss.map(s => ({ id: s.id, mode: 'learn', pm: pmodeFor(s, 'learn'), stage: 2 })));
  startSession('learn', items, `${pad2(n)}강 학습`, { lesson: n });
}
function startCheckpoint(n) {
  S.last = Math.max(S.last || 0, n); save();
  const fresh = LES(n).s.map((_, i) => ({ id: (n - 1) * 5 + i + 1, mode: 'learn', pm: 'ko', tag: '새 응용' }));
  const pool = ALL.filter(s => s.l < n);
  const t = today();
  const scored = pool.map(s => { const c = C(s.id); let sc = Math.random();
    if (c && c.step != null) sc += (c.due <= t ? 2 : 0) + c.lapses + (4 - c.lv) * .4; else sc += c && c.lv ? 1.5 : .5; return { s, sc }; })
    .sort((a, b) => b.sc - a.sc).slice(0, 10).map(x => x.s);
  const cum = shuffle(scored).map(s => ({ id: s.id, mode: 'check', pm: pmodeFor(s, 'check'), tag: '누적' }));
  startSession('cp', fresh.concat(cum), LES(n).t, { lesson: n });
}
function startReview(ids) {
  const list = ids ? ids.map(id => BYID[id]) : buildReview();
  if (!list.length) { toast('먼저 오늘의 5문장 툭!으로 문장을 익혀 주세요'); return; }
  startSession('review', list.map(s => (C(s.id).lv <= 1 && C(s.id).ng > 0 ? orderItem(s, { tag: '덩어리부터' }) : { id: s.id, mode: 'check', pm: pmodeFor(s, 'check'), tag: s.early ? '미리 툭' : '' })), '다시 툭!');
}

function trapFor(s, chunks) {
  const pool = ALL.filter(x => x.l === s.l && x.id !== s.id).flatMap(x => chunkify(x).c.map(t => t.replace(/[，？]$/, '')))
    .filter(t => t.length >= 1 && !chunks.some(c => c.replace(/[，？]$/, '') === t) && !s.zh.includes(t));
  return pool.length ? pick(pool) : null;
}
function orderItem(s, opts) { return Object.assign({ id: s.id, mode: 'order', pm: 'ko', trap: true }, opts || {}); }
function startOrder(n) {
  S.last = Math.max(S.last || 0, n); save();
  startSession('order', LES(n).s.map((_, i) => orderItem(BYID[(n - 1) * 5 + i + 1])), `${pad2(n)}강 · 덩어리 맞추기`, { lesson: n });
}
function startOrderMix() {
  const seen = seenList();
  if (!seen.length) { toast('먼저 강을 하나 골라 덩어리 맞추기를 해 봐요'); lessonSheet(nextLesson()); return; }
  const list = shuffle(seen).sort((a, b) => C(a.id).lv - C(b.id).lv).slice(0, 8);
  startSession('order', shuffle(list).map(s => orderItem(s)), '덩어리 맞추기 · 섞어서');
}
function gradeOrder(id, ok, ctx) {
  const c = card(id), t = today(); markDay();
  if (c.first == null) c.first = t;
  c.last = t; c.lv = Math.max(c.lv, 1); c.ord = (c.ord || 0) + 1;
  if (c.step == null) { c.step = 0; c.due = t + 1; }           // 처음 만난 문장 → 다음 학습일에 ‘말하기’로 복습
  else if (ctx.review && c.due <= t) { c.due = t + 1; }        // 순서 맞추기는 회상이 아니므로 간격을 늘리지 않음
}
function nextItem() {
  SES.i++; SES.hint = 0; SES.revealed = false; SES.t0 = 0; SES.cue = false; SES.busy = false; SES.ord = null;
  if (SES.i >= SES.q.length) finishSession(); else renderDrill();
}

function drillAct(a) {
  const it = SES.q[SES.i], s = BYID[it.id];
  if (a === 'reveal' && !SES.revealed) { SES.rt = performance.now() - SES.t0; SES.revealed = true; clearInterval(timerInt); blip('tap'); renderDrill(); if (S.set.autoQ) speak(s.zh); return; }
  if (a === 'hint' && !SES.revealed && SES.hint < 2) { SES.hint++; blip('tap'); clearInterval(timerInt); renderDrill(); return; }
  if (a === 'cue') { SES.cue = true; clearInterval(timerInt); renderDrill(); return; }
  if ((a === 'ok' || a === 'again') && SES.revealed && !SES.busy) {
    SES.busy = true;
    const ok = a === 'ok';
    grade(it.id, ok, { mode: it.mode, hint: SES.hint > 0, rt: SES.rt, retry: !!it.retry }); save();
    SES.res.push({ id: it.id, ok, rt: SES.rt, hint: SES.hint, retry: !!it.retry, mode: it.mode });
    if (ok) { SES.streak++; SES.best = Math.max(SES.best, SES.streak); blip('ok'); say(pick(LINES.ok), 'win'); burst(); }
    else { SES.streak = 0; blip('again'); say(pick(LINES.again), 'think');
      if (!it.retry) SES.q.splice(Math.min(SES.q.length, SES.i + 3), 0, Object.assign({}, it, { retry: true, mode: 'order', trap: false })); }
    setTimeout(() => {
      nextItem();
    }, ok ? 520 : 380);
  }
}
function finishSession() {
  if (SES.kind === 'cp') { S.cpDone[SES.lesson] = true; }
  save(); go('result');
}

function runClock(sec, el, onEnd) {
  clearInterval(mInt); const t0 = performance.now();
  mInt = setInterval(() => { const left = Math.max(0, sec - (performance.now() - t0) / 1000); if (!document.body.contains(el)) { clearInterval(mInt); return; }
    el.textContent = Math.ceil(left); if (left <= 0) { clearInterval(mInt); blip('done'); onEnd && onEnd(); } }, 100);
}

/* ── 덩어리훈련: 짧은 덩어리 → 늘려 가며 → 완성 문장, 문장 길이별 타이머(5~30초) ── */
function stagesFor(s, build) {
  const fin = chunkify(s), list = [];
  if (build && STAGES[s.zh]) STAGES[s.zh].split('|').forEach(x => { const [c, ko] = x.split('='); list.push({ c: c.split('/'), ko, end: '', zh: c.replace(/\//g, '') }); });
  list.push({ c: fin.c, ko: s.ko, end: fin.end, zh: s.zh, full: true });
  return list;
}
const stageSecs = st => Math.min(30, Math.max(5, Math.round(st.c.join('').replace(/[，？。！]/g, '').length * 1.2)));
function setupOrder(it, s) {
  SES.ord = { stages: stagesFor(s, it.build), si: 0, wrong: 0, hint: 0, tout: 0 };
  SES.t0 = performance.now();
  setupStage();
}
function setupStage() {
  const o = SES.ord, st = o.stages[o.si], s = BYID[SES.q[SES.i].id];
  const cards = st.c.map(t => ({ t, py: pyOf(s.zh, s.py, t) }));
  let sh = shuffle(cards), g = 0;
  while (cards.length > 1 && sh.map(c => c.t).join('') === st.c.join('') && g++ < 8) sh = shuffle(cards);
  const secs = stageSecs(st);
  Object.assign(o, { cards: sh, real: st.c.length, end: st.end, acc: acceptedOrders(st.c), placed: [], bad: -1, sdone: false, secs, tStart: performance.now() });
}
function orderPrefix() {
  const o = SES.ord, txt = o.placed.map(i => o.cards[i].t);
  let best = 0, seq = o.acc[0];
  o.acc.forEach(acc => { let k = 0; while (k < txt.length && txt[k] === acc[k]) k++; if (k > best) { best = k; seq = acc; } });
  return { k: best, seq };
}
function countdown() {
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    const o = SES && SES.ord; if (!o || o.sdone || o.bad >= 0 || screen !== 'drill') return;
    const left = o.secs - (performance.now() - o.tStart) / 1000;
    const cd = $('#cd'), tb = $('#tbar');
    if (cd) cd.textContent = '⏱ ' + Math.max(0, Math.ceil(left));
    if (tb) { tb.style.width = Math.max(0, left / o.secs * 100) + '%'; tb.parentElement.classList.toggle('low', left <= 3); }
    if (left <= 0) {
      o.tout++; o.wrong++; o.si = 0; setupStage(); blip('again');
      renderOrder(SES.q[SES.i], BYID[SES.q[SES.i].id]);
      say('<b>시간 초과!</b> 이 문장의 <b>첫 단계</b>부터 다시 해요. 이번엔 더 빨리 툭!', 'think');
    }
  }, 100);
}
function renderOrder(it, s) {
  const o = SES.ord, st = o.stages[o.si], last = o.si === o.stages.length - 1;
  const num = SES.q.slice(0, SES.i + 1).filter(x => x.mode === 'order').length;
  const pyOn = S.set.py !== false;
  const card = (c, extra, attrs) => `<button class="oc ${extra}" ${attrs}>${pyOn && c.py ? `<small class="py">${esc(c.py)}</small>` : ''}${esc(c.t)}</button>`;
  const rail = [];
  for (let k = 0; k < o.real; k++) {
    const ci = o.placed[k];
    rail.push(ci == null ? `<span class="slot"></span>` : card(o.cards[ci], `placed ${o.sdone ? 'good' : o.bad >= 0 && k >= o.bad ? 'bad' : ''}`, `data-act="oback" data-i="${k}" ${o.sdone ? 'disabled' : ''}`));
  }
  const tray = o.cards.map((c, i) => card(c, o.placed.includes(i) ? 'used' : '', `data-act="opick" data-i="${i}"`).replace('<button', `<button data-n="${i + 1}"`)).join('');
  const line = o.sdone ? (last ? '완성! 이제 <b>소리 내어</b> 문장 전체를 말해요.' : `<b>${o.si + 1}단계</b> 완성! 소리 내어 말하고 덩어리를 더 붙여 봐요.`)
    : o.bad >= 0 ? `앞의 <b>${o.bad}장</b>은 맞아요. 그다음 덩어리를 다시 골라요.`
      : o.si === 0 && o.stages.length > 1 ? '짧은 덩어리부터 시작해요. <b>소리 내며</b> 카드를 눌러요.'
        : o.si > 0 ? '덩어리가 늘어났어요. 앞에서 만든 덩어리를 떠올려요.' : '카드를 누를 때마다 <b>소리 내어</b> 말해요.';
  const pys = st.c.map(t => pyOf(s.zh, s.py, t)).join(' ');
  const left = Math.max(0, o.secs - (performance.now() - o.tStart) / 1000), pct = left / o.secs * 100;
  app.innerHTML = `${topBar(esc(SES.title), subLine(), 'quit')}${progBar()}

        <button class="pill" style="border:0" data-act="pytog">병음 ${pyOn ? 'ON' : 'OFF'}</button>${o.sdone ? '' : `<span class="cd" id="cd">⏱ ${Math.ceil(left)}</span>`}</div>

        : `<div class="tray">${tray}</div>`}

      : `<div class="btns"><button class="btn line" data-act="oundo" ${o.placed.length ? '' : 'disabled'}>되돌리기</button><button class="btn secondary" data-act="ohint">마음싹 힌트</button></div>`}`;
  if (!o.sdone) countdown(); else clearInterval(timerInt);
}
function orderAct(a, i) {
  const o = SES.ord; if (!o || SES.busy) return;
  const it = SES.q[SES.i], s = BYID[it.id];
  if (o.sdone) {
    if (a === 'onext') { if (o.si < o.stages.length - 1) { o.si++; setupStage(); renderOrder(it, s); } else nextItem(); }
    return;
  }
  if (o.bad >= 0) return;
  if (a === 'opick' && o.cards[i] && !o.placed.includes(i) && o.placed.length < o.real) { o.placed.push(i); blip('tap'); }
  else if (a === 'oback') o.placed.splice(i, 1);
  else if (a === 'oundo') o.placed.pop();
  else if (a === 'ohint') {
    const { k, seq } = orderPrefix(); o.placed.length = k;
    const ci = o.cards.findIndex((c, j) => c.t === seq[k] && !o.placed.includes(j));
    if (ci >= 0) { o.placed.push(ci); o.hint++; }
  }
  if (o.placed.length === o.real) {
    const { k } = orderPrefix(), st = o.stages[o.si], last = o.si === o.stages.length - 1;
    if (k === o.real) {
      o.sdone = true; clearInterval(timerInt);
      if (last) {
        SES.rt = performance.now() - SES.t0;
        const ok = !o.wrong && !o.hint;
        gradeOrder(it.id, ok, { review: SES.kind === 'review' }); save();
        SES.res.push({ id: it.id, ok, rt: SES.rt, hint: o.hint, retry: !!it.retry, mode: 'order' });
        if (ok) { SES.streak++; SES.best = Math.max(SES.best, SES.streak); } else SES.streak = 0;
      }
      blip('ok'); renderOrder(it, s); if (last) burst();
      if (S.set.autoQ) speak(st.zh);
      return;
    }
    o.wrong++; o.bad = k; blip('again'); renderOrder(it, s);
    SES.busy = true;
    setTimeout(() => { o.placed.length = o.bad; o.bad = -1; SES.busy = false; if (screen === 'drill' && SES.ord === o) renderOrder(it, s); }, 950);
    return;
  }
  renderOrder(it, s);
}

function renderDrill() {

    const weak = ALL.filter(s => { const c = C(s.id); return c && c.step != null && (c.due <= t || c.lapses >= 2); }).sort((a, b) => C(b.id).lapses - C(a.id).lapses);
    body = `<div class="stats"><div><strong>${rts.length >= 6 ? fmtS(avg(rts.slice(0, 20))) : '–'}</strong><span>처음 20번 응답</span></div><div><strong style="color:var(--green)">${rts.length >= 6 ? fmtS(avg(rts.slice(-20))) : '–'}</strong><span>최근 20번 응답</span></div><div><strong>${S.days.length}</strong><span>학습한 날</span></div></div>
      <div class="box lvbars">${[4, 3, 2, 1].map(lv => `<div class="r"><span>${LV[lv]}</span><div class="b"><i class="lv${lv}" style="width:${k.by[lv]}%"></i></div><span>${k.by[lv]}</span></div>`).join('')}
        <p class="note" style="margin:6px 0 0">‘입에 붙음’은 <b>응용 툭!</b> 이상이에요. 완성 툭!은 다음 날·3일 뒤 복습에서 힌트 없이 이어서 성공하면 올라가요.</p></div>
      <div class="box scroll" style="flex:1"><div class="row"><h4 class="grow" style="margin:0">복습이 필요한 문장 ${weak.length}</h4>${weak.length ? '<button class="pill" style="border:0" data-act="reviewweak">이것만 다시 툭!</button>' : ''}</div>
        ${weak.length ? `<ul class="slist" style="margin:4px 0 0">${weak.slice(0, 20).map(s => `<li><span class="dot lv${C(s.id).lv}"></span><div class="grow"><div class="zh">${esc(s.zh)}</div><small>${pad2(s.l)}강${C(s.id).lapses ? ' · 놓친 횟수 ' + C(s.id).lapses : ''}</small></div></li>`).join('')}</ul>` : '<p class="note">지금은 없어요. 좋은 흐름이에요!</p>'}</div>`;
  } else {
    const B = S.ba.before, A = S.ba.after, v = (o, key, u) => o && o[key] != null && o[key] !== '' ? esc(o[key]) + u : '–';
    const rows = [['첫 마디까지', 'first', '초'], ['말한 문장 수', 'sent', '개'], ['이어 말한 최대', 'chain', '문장'], ['멈칫한 횟수', 'pause', '번']];
    body = `<div class="box"><div class="cmp"><span></span><span class="h">Before · 1강 전</span><span class="h">After · 20강 후</span>${rows.map(r => `<span>${r[0]}</span><span class="v">${v(B, r[1], r[2])}</span><span class="v a">${v(A, r[1], r[2])}</span>`).join('')}</div></div>
      <div class="box scroll" style="flex:1"><h4>말한 내용 메모</h4><p class="note" style="margin:0"><b>Before</b> ${B && B.memo ? esc(B.memo) : '아직 없어요'}<br><b>After</b> ${A && A.memo ? esc(A.memo) : '아직 없어요'}</p></div>
      <button class="btn primary" data-act="ba">실력 확인 툭! · 1분 말하기</button>`;
  }
  app.innerHTML = `${topBar('성장 기록', '자가평가 기반 기록 · 공인 평가가 아니에요')}
    <div class="tabs">${[['map', '100문장 지도'], ['log', '숙련 · 복습'], ['ba', 'Before · After']].map(([id, n]) => `<button class="${repTab === id ? 'on' : ''}" data-act="rtab" data-t="${id}">${n}</button>`).join('')}</div>
    <div class="fill">${body}</div>`;
}

/* ═════════ 16. 실력 확인 툭! (Before & After) ═════════ */
let baTab = 'before', baFirst = null, baRun = false;
function renderBA(arg) {
  if (arg && arg.tab) baTab = arg.tab;
  const rec = S.ba[baTab];
  baFirst = null; baRun = false;
  app.innerHTML = `${topBar('실력 확인 툭!', '같은 미션으로 1강 전과 20강 후를 비교해요')}
    <div class="tabs">${[['before', 'Before · 1강 전'], ['after', 'After · 20강 후']].map(([id, n]) => `<button class="${baTab === id ? 'on' : ''}" data-act="batab" data-tab="${id}">${n}${S.ba[id] ? ' ✓' : ''}</button>`).join('')}</div>
    ${coach('정확한 문장보다 <b>멈추지 않고 이어 말하기</b>가 목표예요. 휴대폰 녹음 앱을 같이 켜 두면 좋아요.')}
    <section class="card" style="justify-content:center;text-align:center;gap:12px">
      <div><span class="pill gold">미션</span><div class="prompt" style="margin-top:6px">${esc(BA_MISSION.title)}</div></div>
      <div class="cues">${BA_MISSION.cues.map(c => `<span>${esc(c)}</span>`).join('')}</div>
      <div class="clock" id="baclock">60</div>
      <div class="note" id="banote">${rec ? `저장된 기록 · 첫 마디 ${rec.first ?? '–'}초 · ${rec.sent ?? '–'}문장 (${new Date(rec.at).toLocaleDateString('ko-KR')})` : '시작을 누르고, 말을 처음 꺼낸 순간 ‘첫 마디’를 눌러요.'}</div>
    </section>
    <div class="btns"><button class="btn primary" data-act="bago" id="bago">시작</button><button class="btn secondary" data-act="bafirst" id="bafirst" disabled>첫 마디 뗐어요!</button></div>
    <div class="btns"><button class="btn line" data-act="baform">${rec ? '기록 고치기' : '기록 입력하기'}</button></div>`;
}
function baFormSheet() {
  const r = S.ba[baTab] || {}, val = x => esc(x == null ? '' : x);
  openModal(`${sheetHead((baTab === 'before' ? 'Before' : 'After') + ' 기록')}
    <form class="form" id="baform"><div class="two">
      <div><label for="ba-first">첫 마디까지 (초)</label><input type="number" inputmode="decimal" step="0.1" min="0" id="ba-first" value="${val(baFirst != null ? baFirst : r.first)}"></div>
      <div><label for="ba-sent">말한 문장 수</label><input type="number" inputmode="numeric" min="0" id="ba-sent" value="${val(r.sent)}"></div>
      <div><label for="ba-chain">이어 말한 최대 문장</label><input type="number" inputmode="numeric" min="0" id="ba-chain" value="${val(r.chain)}"></div>
      <div><label for="ba-pause">길게 멈칫한 횟수</label><input type="number" inputmode="numeric" min="0" id="ba-pause" value="${val(r.pause)}"></div></div>
      <label for="ba-memo">말한 내용 메모 (중국어·한국어 섞어도 OK)</label><textarea id="ba-memo" rows="3">${esc(r.memo || '')}</textarea>
      <button class="btn primary" style="width:100%;margin-top:12px" type="submit">기록 저장</button></form>`);
}

/* ═════════ 17. 설정 · 백업 ═════════ */
function settingsSheet() {
  const st = S.set;
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="${st[key] === v ? 'on' : ''}" data-act="set" data-k="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
  openModal(`${sheetHead('설정')}
    <div class="form">
      <label>문제 방식</label>${seg('qmode', [['ko', '한국어 상황'], ['mix', '섞기 (추천)'], ['q', '중국어 질문']])}
      <label>중국어 음성 속도 <span style="font-weight:500">· 목소리: ${esc(voiceName ? (/ting-?ting|婷婷/i.test(voiceName) ? 'Tingting (여자)' : voiceName + ' (여자)') : '기기 기본 중국어 음성')}</span></label>${seg('rate', [[0.7, '천천히'], [0.85, '보통'], [1, '빠르게']])}
      ${voiceName && /ting-?ting|婷婷/i.test(voiceName) ? '' : '<p class="note" style="margin:4px 0 0">Tingting 목소리는 아이폰·아이패드·맥에 들어 있어요. 이 기기에는 없어서 가장 비슷한 여자 목소리로 읽어요.</p>'}
      <label>배경음악</label><div class="seg"><button class="${st.bgm ? 'on' : ''}" data-act="tog" data-k="bgm">힐링 음악 ${st.bgm ? 'ON' : 'OFF'}</button></div>
      <label>효과음 · 자동 읽기</label><div class="seg"><button class="${st.sound ? 'on' : ''}" data-act="tog" data-k="sound">효과음 ${st.sound ? 'ON' : 'OFF'}</button><button class="${st.autoQ ? 'on' : ''}" data-act="tog" data-k="autoQ">자동 읽기 ${st.autoQ ? 'ON' : 'OFF'}</button></div>
    </div>
    <div class="hr"></div>
    <p class="note" style="margin:0 0 8px">기록은 로그인 없이 <b>이 브라우저에만</b> 저장돼요${storeOK ? '' : ' (지금은 저장소를 쓸 수 없어 창을 닫으면 사라져요)'}. 기기를 바꿀 때는 백업 코드를 옮겨 주세요.</p>
    <div class="btns"><button class="btn secondary" data-act="export">백업 코드 복사</button><button class="btn secondary" data-act="importshow">백업 붙여넣기</button></div>
    <div id="bk"></div>
    <div class="hr"></div>
    <p class="note" style="margin:0 0 10px">숙련 단계는 <b>자가평가</b>예요 · 100개 문장은 검수 전 <b>초안</b>이에요 · 음성은 기기의 중국어 TTS를 써요.</p>
    <button class="btn line" style="width:100%;color:var(--red)" data-act="reset1">모든 기록 지우기</button>
    <p class="tiny" style="text-align:center;margin:12px 0 0">© 2026 진담중국어 (Jindam Chinese). All rights reserved.</p>`);
}

/* ═════════ 18. 이벤트 ═════════ */
document.addEventListener('click', e => {
  const sayEl = e.target.closest('[data-say]'); if (sayEl) { speak(sayEl.dataset.say); return; }
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'home': go('home'); break;
    case 'close': closeModal(); break;
    case 'lessons': openLessons(+d.ch || 0); break;
    case 'lesson': lessonSheet(+d.n); break;
    case 'start': startLesson(+d.n); break;
    case 'relesson': startSession('review', LES(+d.n).s.map((_, i) => { const s = BYID[(+d.n - 1) * 5 + i + 1]; return { id: s.id, mode: 'check', pm: pmodeFor(s, 'check') }; }), `${pad2(+d.n)}강 다시 툭!`); break;
    case 'startcp': startCheckpoint(+d.n); break;
    case 'review': startReview(); break;
    case 'reviewweak': { const t = today(); startReview(ALL.filter(s => { const c = C(s.id); return c && c.step != null && (c.due <= t || c.lapses >= 2); }).slice(0, REVIEW_CAP).map(s => s.id)); break; }
    case 'ordersheet': orderSheet(); break;
    case 'ostart': startOrder(+d.n); break;
    case 'omix': startOrderMix(); break;
    case 'opick': case 'oback': orderAct(a, +d.i); break;
    case 'oundo': case 'ohint': case 'onext': orderAct(a); break;
    case 'pytog': S.set.py = S.set.py === false; save(); renderOrder(SES.q[SES.i], BYID[SES.q[SES.i].id]); break;
    case 'mine': go('mine', d.l ? { l: +d.l } : null); break;
    case 'mineall': closeModal(); mineL = null; go('mine', null); minePickSheet(); break;
    case 'minepick': minePickSheet(); break;
    case 'minesel': mineSel = +d.id; mineCount = 0; closeModal(); renderMine(); break;
    case 'minesaved': { const arr = S.mine[mineSel] || [];
      openModal(`${sheetHead('이 문장으로 만든 내 문장')}<ul class="slist">${arr.map((m, i) => `<li><div class="grow"><div class="zh">${esc(m.t)}</div><small>${new Date(m.at).toLocaleDateString('ko-KR')}</small></div><button class="pill" style="border:0" data-act="minedel" data-i="${i}">삭제</button></li>`).join('')}</ul>`); break; }
    case 'minedel': { (S.mine[mineSel] || []).splice(+d.i, 1); save(); closeModal(); renderMine(); break; }
    case 'cnt': { mineCount = Math.max(mineCount, +d.i); blip('tap'); document.querySelectorAll('.cnt3 button').forEach((b, j) => b.classList.toggle('on', j < mineCount));
      if (mineCount >= 3) { $('#minesave').textContent = '저장 · 응용 툭! 달성'; $('#minekeys').textContent = '저장하면 숙련 단계가 ‘응용 툭!’이 돼요'; } break; }
    case 'minesave': {
      const v = ($('#mytext').value || '').trim(); if (!v) { toast('내 문장을 먼저 적어 주세요'); $('#mytext').focus(); break; }
      (S.mine[mineSel] = S.mine[mineSel] || []).unshift({ t: v, at: Date.now() }); markDay();
      const up = mineCount >= 3; if (up) { const c = card(mineSel); c.lv = Math.max(c.lv, 3); }
      save(); mineCount = 0; renderMine();
      toast(up ? '응용 툭! 달성 · 이제 내 이야기예요' : '저장했어요 · 3번 말하면 응용 툭!'); if (up) { blip('ok'); }
      break; }
    case 'report': go('report'); break;
    case 'rtab': repTab = d.t; renderReport(); break;
    case 'cell': { const s = BYID[+d.id], c = C(s.id) || { lv: 0 }; const mine = S.mine[s.id] || [];
      openModal(`${sheetHead(`${pad2(s.l)}강 · ${s.id}번 문장`)}<div class="row" style="margin-bottom:8px"><span class="pill">${LV[c.lv]}</span>${s.cp ? '<span class="pill gold">응용</span>' : ''}</div>
        ${c.lv ? `<div class="zh row" style="font-size:22px;font-weight:700">${esc(s.zh)}${sayBtn(s.zh)}</div><div class="tiny">${esc(s.py)}</div>` : '<div class="muted" style="font-weight:700">아직 만나지 않은 문장이에요</div>'}
        <div style="margin-top:4px">${esc(s.ko)}</div>${c.step != null ? `<p class="note">다음 복습: ${c.due <= today() ? '오늘' : (c.due - today()) + '일 뒤'} · 혼자 말함 ${c.ok} · 다시 연습 ${c.ng}</p>` : ''}
        ${mine.length ? `<div class="hr"></div><div class="lab" style="margin-top:0">내 문장</div>${mine.slice(0, 3).map(m => `<div class="zh" style="font-weight:700">${esc(m.t)}</div>`).join('')}` : ''}`); break; }
    case 'ba': go('ba', d.tab ? { tab: d.tab } : null); break;
    case 'batab': baTab = d.tab; renderBA(); break;
    case 'baform': baFormSheet(); break;
    case 'bago': {
      if (baRun) break; baRun = true; baFirst = null; const t0 = performance.now(); el.disabled = true; el.textContent = '말하는 중…';
      const fb = $('#bafirst'); fb.disabled = false; fb.dataset.t0 = t0; $('#banote').textContent = '말을 처음 꺼낸 순간 ‘첫 마디’를 눌러요.';
      runClock(60, $('#baclock'), () => { baRun = false; el.disabled = false; el.textContent = '다시 하기'; fb.disabled = true; $('#banote').textContent = '끝! 기록을 남겨 주세요.'; baFormSheet(); });
      break; }
    case 'bafirst': { baFirst = Math.round((performance.now() - +el.dataset.t0) / 100) / 10; el.disabled = true; el.textContent = '첫 마디 ' + baFirst + '초'; blip('tap'); break; }
    case 'settings': settingsSheet(); break;
    case 'speak': speakMission(+d.n); break;
    case 'mgo': { el.disabled = true; el.textContent = '말하는 중…'; runClock(+d.sec, $('#mclock'), () => { el.disabled = false; el.textContent = '다시 하기'; toast('수고했어요! 막힌 부분은 다시 툭!에서 만나요'); }); break; }
    case 'tuk':
      if (screen === 'home') { const tr = $('#trainer'); if (tr) { tr.classList.remove('bump'); void tr.offsetWidth; tr.classList.add('bump'); } }
      if (screen === 'drill' && SES.ord && !SES.ord.done) orderAct('ohint');
      else if (screen === 'drill' && SES.ord) say('맞춘 문장을 <b>소리 내어</b> 말해요. 그게 진짜 훈련이에요.', 'win');
      else if (screen === 'drill' && !SES.revealed && SES.hint < 2) drillAct('hint');
      else if (screen === 'drill') say(pick(LINES.ans), 'win');
      else { S.tipI = ((S.tipI || 0) + 1) % TIPS.length; save(); say(TIPS[S.tipI], 'win'); }
      break;
    case 'reveal': case 'hint': case 'ok': case 'again': case 'cue': drillAct(a); break;
    case 'quit':
      if (SES && SES.res.length) openModal(`${sheetHead('여기서 그만할까요?')}<p class="note" style="margin:0 0 14px">지금까지 답한 ${SES.res.length}문장의 기록은 저장돼 있어요.</p><div class="btns"><button class="btn line" data-act="close">계속하기</button><button class="btn primary" data-act="home">그만하기</button></div>`);
      else go('home');
      break;
    case 'set': { S.set[d.k] = d.k === 'rate' ? +d.v : d.v; save(); settingsSheet(); if (d.k === 'rate') speak('我想去中国旅游。'); break; }
    case 'tog': S.set[d.k] = !S.set[d.k]; save(); if (d.k === 'bgm') { S.set.bgm ? BGM.start() : BGM.stop(); } settingsSheet(); break;
    case 'bgm': { S.set.bgm = !S.set.bgm; save(); S.set.bgm ? BGM.start() : BGM.stop(); el.innerHTML = S.set.bgm ? IC.music : IC.mute; toast(S.set.bgm ? '힐링 음악을 켰어요' : '음악을 껐어요'); break; }
    case 'export': {
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      $('#bk').innerHTML = `<textarea readonly rows="3" style="font-size:11px;margin-top:8px">${code}</textarea>`; $('#bk textarea').select();
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('백업 코드를 복사했어요'), () => toast('코드를 길게 눌러 직접 복사해 주세요'));
      break; }
    case 'importshow': $('#bk').innerHTML = `<textarea id="imp" rows="3" placeholder="백업 코드를 붙여 넣으세요" style="font-size:11px;margin-top:8px"></textarea><button class="btn primary" style="width:100%;margin-top:8px" data-act="import">이 기록으로 바꾸기</button>`; break;
    case 'import': {
      try { const o = JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); if (!o || !o.cards) throw 0; S = Object.assign(blank(), o); S.set = Object.assign(blank().set, o.set); save(); toast('기록을 불러왔어요'); go('home'); }
      catch (err) { toast('백업 코드를 확인해 주세요'); } break; }
    case 'reset1': el.outerHTML = '<p class="note" style="color:var(--red);margin:0 0 8px">정말 지울까요? 되돌릴 수 없어요.</p><div class="btns"><button class="btn line" data-act="close">취소</button><button class="btn warn" data-act="reset2">모두 지우기</button></div>'; break;
    case 'reset2': S = blank(); BGM.stop(); save(); toast('기록을 모두 지웠어요'); go('home'); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'baform') return; e.preventDefault();
  const v = id => { const x = $('#' + id).value.trim(); return x === '' ? null : x; };
  S.ba[baTab] = { first: v('ba-first'), sent: v('ba-sent'), chain: v('ba-chain'), pause: v('ba-pause'), memo: $('#ba-memo').value, at: Date.now() };
  markDay(); save(); closeModal(); toast((baTab === 'before' ? 'Before' : 'After') + ' 기록을 저장했어요'); renderBA();
  say(baTab === 'before' ? '좋아요! 4주 뒤 <b>After</b>에서 오늘의 나와 비교해요.' : '4주 동안 수고했어요! <b>성장 기록</b>에서 비교해 보세요.', 'win'); burst();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('textarea,input')) return;
  if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
  if (screen !== 'drill' || !$('#modal').hidden || !SES) return;
  const k = e.key.toLowerCase();
  if (SES.ord) {
    if (SES.ord.done) { if (k === 'enter' || k === ' ') { e.preventDefault(); orderAct('onext'); } return; }
    if (/^[1-9]$/.test(k)) orderAct('opick', +k - 1); else if (k === 'backspace') { e.preventDefault(); orderAct('oundo'); } else if (k === 'h') orderAct('ohint');
    return;
  }
  if (!SES.revealed) { if (k === ' ' || k === 'enter') { e.preventDefault(); drillAct('reveal'); } else if (k === 'h') drillAct('hint'); }
  else { if (k === '1' || k === 'arrowleft') drillAct('again'); else if (k === '2' || k === 'enter' || k === 'arrowright') { e.preventDefault(); drillAct('ok'); } else if (k === 's') speak(BYID[SES.q[SES.i].id].zh); }
});

go('home');
})();

</script>
